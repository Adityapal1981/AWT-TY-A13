<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Event Registration Analyzer</h1>

    <form id="eventForm" onsubmit="return checkForm()">

        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="roll">Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">

        <label for="event">Event Name</label>
        <input type="text" id="event" placeholder="Enter event name">

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter age">

        <label for="events">Number of Events Attended</label>
        <input type="number" id="events" placeholder="Enter number of events">

        <button type="submit">Analyze</button>

    </form>

    <h2 id="result"></h2>

    <h2>Preferred Technical Events</h2>

    <ul id="eventList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
