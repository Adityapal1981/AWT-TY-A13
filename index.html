<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Event Registration Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Event Registration Analyzer</h1>

    <div class="details">
        <p><b>Student Name:</b> Your Name</p>
        <p><b>Roll Number:</b> Your Roll Number</p>
        <p><b>Subject Name:</b> Advanced Web Technology</p>
        <p><b>Subject Code:</b> Your Subject Code</p>
    </div>

    <form id="eventForm" onsubmit="return checkForm()">

        <label>Name</label>
        <input type="text" id="name">

        <label>Roll Number</label>
        <input type="text" id="roll">

        <label>Event Name</label>
        <input type="text" id="event">

        <label>Age</label>
        <input type="number" id="age">

        <label>Number of Events Attended</label>
        <input type="number" id="events">

        <button type="submit">Analyze</button>

    </form>

    <h2 id="result"></h2>

    <h2>Preferred Technical Events</h2>

    <ul id="eventList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
